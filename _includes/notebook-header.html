<header class="site-header shell">
  <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="That guy dhruv — home">that guy <em>dhruv</em><span aria-hidden="true">✳</span></a>
  <nav aria-label="Main navigation"><ul>
  {% for link in site.data.navigation.main %}
    {% assign current = false %}
    {% if page.url == link.url %}{% assign current = true %}{% elsif link.url != '/' and page.url contains link.url %}{% assign current = true %}{% endif %}
    <li><a href="{{ link.url | relative_url }}"{% if current %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
  {% endfor %}
  </ul></nav>
</header>
