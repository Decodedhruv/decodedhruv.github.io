# Personal adaptation of Academic Pages. SiteGround/custom domain is not connected.
locale: en-US
title: Dhruva Nagesh
title_separator: "·"
name: Dhruva Nagesh
description: "Politics, philosophy, economics, and things noticed along the way. Public work and writing by Dhruva Nagesh."
url: https://decodedhruv.github.io
baseurl: ""
repository: decodedhruv/decodedhruv.github.io
timezone: Europe/London
author:
  name: Dhruva Nagesh
  github: decodedhruv
social:
  type: Person
  name: Dhruva Nagesh
  links:
    - https://github.com/decodedhruv
    - https://www.linkedin.com/in/dhruvanagesh/
include: [_pages]
exclude:
  - vendor
  - .bundle
  - .github
  - docs
  - AGENTS.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - package.json
  - Dockerfile
  - docker-compose.yaml
  - markdown_generator
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - scripts
  - files
  - assets/js
  - assets/webfonts
  - assets/css/academicons.css
  - assets/css/academicons.min.css
  - assets/css/fontawesome.css
  - assets/fonts
  - assets/css/main.scss
  - images/bio-photo.jpg
  - images/bio-photo-2.jpg
  - images/profile.png
  - images/500x300.png
  - images/500x300.jpg
  - images/800x400.png
  - images/abstract-1.jpg
  - images/abstract-2.jpg
  - images/abstract-3.jpg
  - images/abstract-4.jpg
  - images/abstract-5.jpg
  - images/abstract-6.jpg
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
collections:
  work:
    output: true
    permalink: /public-work/:path/
  writing:
    output: true
    permalink: /writing/:path/
defaults:
  - scope:
      path: ""
    values:
      layout: notebook-page
  - scope:
      path: ""
      type: posts
    values:
      layout: notebook-entry
      section: Notes
  - scope:
      path: ""
      type: work
    values:
      layout: notebook-entry
      section: Public Work
  - scope:
      path: ""
      type: writing
    values:
      layout: notebook-entry
      section: Writing
permalink: /notes/:year/:month/:day/:title/
future: false
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-sitemap
feed:
  path: feed.xml
compress_html:
  clippings: all
  ignore:
    envs: development
